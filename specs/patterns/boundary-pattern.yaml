# VCDesign Pattern: Boundary Structure
# Purpose: Define the generic structure of an "Explicit Verification Point" (Boundary).

id: "vcdesign-pattern-boundary"
title: "Boundary Structure Pattern"
layer: "pattern"
status: "stable"
version: "1.2.0"

meta:
  concept: "A structural choke point where implicit values are blocked and explicit judgments are required."
  implements: "vcdesign-core-decision-posture"

# -------------------------------------------------------------------
# Structure
# -------------------------------------------------------------------
boundary:
  role: "The interface between Unverified Space (Outside) and Verified Space (Inside)."

  components:
    guard:
      description: "The agent or logic responsible for the check."
      reference: "vcdesign-pattern-rca"

    handshake:
      description: "The mechanism for promotion if accepted."
      reference: "vcdesign-protocol-resolution-handshake"

    tenure:
      description: >
        The continuity attribution of the boundary itself (v1.1.0).
        A guard answers "is this crossing correct now?" (gate);
        tenure answers "who holds this boundary over time?" (line).
        See core/value-tenure-model.md.
      fields:
        owner:
          description: >
            この境界の現在の責任保有者。guard（チェックの実行主体）とは別に、
            境界の定義そのものを保有し、見直しに責任を持つ主体。
        accountability_on_cross:
          description: >
            越境が「誰も見ていない自律運用中」に起きた場合の責任帰属。
            事後に押し付け先を探すのではなく、無人時間帯の帰属を事前に宣言する。
            未宣言の場合、その境界は tenure 不在（gate のみ）とみなす。
        drift_signals:
          description: >
            越境・逸脱・境界定義の陳腐化にどう気づくかの観点。
            metrics.yaml の boundary_violation_rate / tenure_metrics と接続する。

    containment:
      description: >
        The failure-isolation role of the boundary (v1.2.0) — 結合を切る / 上限の宣言.
        A guard stops a wrong crossing; containment declares how far a failure
        on one side may propagate to the other. See core/downside-containment-model.md.
      fields:
        failure_domain:
          description: この境界が閉じ込める障害区画（schema_case.yaml failure_domain と対応）
        propagation:
          description: >
            区画外への伝播の扱い。deny（伝播させない）/ attested_only（証跡付きのみ通す）/ allow。
            未宣言の場合は deny とみなす。
        max_loss:
          description: この境界の内側で許容する損失の上限（schema_case.yaml blast_radius.max_loss と同じ単位系）
        on_breach:
          description: >
            上限超過・伝播発生時の動作。quarantine / halt / deny。
            protocols/resolution-handshake.yaml の routing_on_failure と対応する。
        shared_dependencies:
          description: >
            区画をまたいで共有されている依存先（隔壁の穴）。
            空でない場合、その依存先は metrics.yaml dependency_concentration の観測対象になる。

    revalidation:
      description: >
        The chain-reset role of the boundary (v1.2.0) — 連鎖のリセット.
        上流で閉じた判断の結論をそのまま引き継がず、境界で前提・根拠・権限を再検証する。
        tenure の re_derivation_basis（担当交代をまたぐ時間方向の再導出）とは別概念であり、
        こちらは境界をまたぐ空間方向の再検証である。
      fields:
        upstream_trust:
          description: >
            上流の結論をどこまで信頼するか。none（既定。結論を引き継がない）/ attested（証跡があれば引き継ぐ）。
        re_check:
          description: 再検証する項目（precondition / evidence_freshness / authority 等）
        on_mismatch:
          description: 再検証で不一致が出た場合の扱い。既定は UNKNOWN として IDG に流す。

# -------------------------------------------------------------------
# Flow
# -------------------------------------------------------------------
flow:
  1. **Intercept**: All inputs must pause at the boundary.
  2. **Assess**: The Guard (RCA) evaluates the input, re-checking upstream basis per `revalidation` (upstream ACCEPTED is not inherited).
  3. **Close**: The Guard issues ACCEPTED, DENIED, or UNKNOWN.
  4. **Act**: 
     - If ACCEPTED -> Handshake (Resolution).
     - If DENIED -> Block, and contain per `containment.on_breach` (no propagation outside failure_domain).
     - If UNKNOWN -> Escalate.

# -------------------------------------------------------------------
# Application
# -------------------------------------------------------------------
application:
  - "Use at system ingress (API Gateways)."
  - "Use at critical value transitions (e.g. LLM output to User)."
  - "Use between untrusted components."
