meta:
  id: ADJACENT_BOUNDARY_OBSERVATION_POLICY
  title: Adjacent Boundary Observation & Non-Chain Coupling
  layer: policy
  status: draft
  version: 0.1.0
  part_of: operational-policy-set.md

# ---------------------------------------------------------------------
# Article 1 — 隣接境界観測ルール
# ---------------------------------------------------------------------
article_1:
  id: ARTICLE-1-ADJACENT-OBSERVATION
  title: 隣接境界観測ルール

  rule: >
    境界の検証範囲には、その境界の一個外までを含めること。
    これは作法（推奨事項）ではなく、検証が成立するための必要条件である。

  rule_basis: >
    境界の妥当性は境界の内側から観測できない。内側から見えるのは境界内の整合だけであり、
    境界の置き場所そのものが誤っている場合、その症状は必ず外側に出る。
    したがって一個外を見ない検証は、境界の内的整合しか確認しておらず、
    境界そのものの妥当性は未検証のまま残る。

  stop_at_one:
    rule: 二個外までは見ない。
    reason: >
      一個外までは、結果を誰の判断に帰属させるかを追跡できる。二個外まで広げると、
      因果が薄まり帰属不能になる——「誰の境界判断のせいか」に答えられなくなる。
      加えて、連鎖内の各ノードが同じ規則（自分の一個外を見る）を守っていれば、
      すべての境界はその両側から観測されることになる。局所規則のまま、
      連鎖全体が二重に被覆される。二個外まで見るのは、この被覆がすでに
      成立している範囲を重複して検証することになり、境界の妥当性ではなく
      帰属できない責任範囲を検証することになる。

  mutuality_condition:
    description: >
      この規則が成立するのは、隣接ノードも同じ規則を守っている場合に限る。
      単独では不完全であり、必ず対で運用しなければならない。
    required_pair:
      - 自分の一個外を観測する
      - 隣も同じ規則で自分（＝この境界）を観測していることを確認する
    failure_mode: >
      連鎖内で一ノードでもこの規則を守らないと、そこに穴が空く。
      かつその穴は両隣のどちらからも見えない——互いに「相手が見ているはず」と
      想定するため、穴の存在自体が可視化されない。
    precedent: >
      TPS（トヨタ生産方式）で「後工程はお客様」と「不良を後工程に流さない」が
      必ず対で語られるのは同じ構造である。どちらか一方だけを守る現場は、
      もう一方を相手が守っていると想定して穴を見落とす。

  failure_precedent:
    case: Mars Climate Orbiter（NASA, 1999）
    description: >
      Lockheed Martin が開発した航法ソフトウェアはヤード・ポンド法（pound-seconds）で
      推力データを出力し、JPL が開発した運用ソフトウェアはメートル法（newton-seconds）を
      前提に受け取っていた。それぞれの境界の内側では検証はすべて green だった——
      各チームは自分のモジュールの整合性しか見ていなかった。境界の一個外、
      すなわち引き渡し先が前提としている単位系は、どちらのチームの検証範囲にも
      入っていなかった。結果、探査機は火星大気圏に予定より低い高度で進入し、
      破壊された（NASA JPL 事故調査報告書, 1999）。
    pattern: >
      境界内の整合チェックはすべて green。しかし境界の一個外（引き渡し先の
      前提条件）との整合は誰も見ていない。結果、境界の位置そのものが
      間違っていたという症状は、境界の外——このケースでは探査機の喪失という
      形——でしか現れなかった。

  applies_when:
    - 責任境界を新規に定義するとき
    - 既存境界の妥当性を再評価するとき
    - 引き継ぎ・ハンドオフの直前直後

# ---------------------------------------------------------------------
# Article 2 — 非連鎖結合の扱い
# ---------------------------------------------------------------------
article_2:
  id: ARTICLE-2-NON-CHAIN-COUPLING
  title: 非連鎖結合の扱い

  rule: >
    距離規則（Article 1）が届かない結合クラスは、距離ではなく列挙によって
    網羅する義務を負う。列挙を怠ってはならない。

  rule_basis: >
    Article 1 の「一個外」は連鎖上の距離を前提にしている。しかし現実の結合には、
    連鎖の隣接関係を経由せず、二個先以上と直接つながるものがある。
    これらは共通原因（common cause）による結合であり、距離という概念そのものが
    効かないため、Article 1 の規則では原理的に被覆できない。

  enumerated_classes:
    - class: 用力系
      examples: [電源, エア, 冷却水]
    - class: 同一ロット
      examples: [同一原材料ロット, 同一製造ロット]
    - class: 同一作業者
      examples: [同一人物が複数工程を担当]
    - class: 共通ネットワーク・クロック
      examples: [共通NTPソース, 共通スイッチ, 共通タイムベース]

  failure_precedent:
    case: 2012年うるう秒バグ（Linuxカーネル, 複数企業へ波及）
    description: >
      2012年6月30日のうるう秒挿入時、Linuxカーネルのタイマー処理に存在した
      バグにより、Reddit・Mozilla・LinkedIn・Yelp・Qantas の予約システムなど、
      互いに連鎖上の隣接関係を持たない多数の企業のサーバー群が、ほぼ同時刻に
      CPU使用率100%でハングした。各社のシステムは互いにAPIで直接つながっては
      おらず、Article 1 の「一個外の観測」ではどちらの担当者からも相手が
      見えない位置関係にあった。共通原因は、全員が依存していた共通クロック源
      （うるう秒を反映するNTP経由の時刻同期）と、それを処理するカーネルの
      共通コードだった。
    pattern: >
      距離ベースの観測はこの種の障害を構造的に検知できない——観測すべき
      「一個外」が存在しないため、規則そのものが空振りする。列挙されていない
      共通原因は、発生するまで誰の検証対象にもならない。

  stop_at:
    rule: >
      本条は「列挙されたクラスに属する結合」を対象とする。未列挙の共通原因を
      推測で網羅しようとしない。
    reason: >
      距離ではなく列挙で押さえる以上、この規則の保証範囲は列挙の完全性に
      一致する。列挙を超えて「まだ知らない共通原因」まで保証しようとすると、
      検証不能な主張になる。新しい共通原因が判明した時点でクラスを追加し、
      履歴として残すことが正しい拡張であり、事前の完全性を装うことではない。

  relation_to_article_1: >
    Article 1 の下位項目ではない。Article 1 は連鎖方向（隣接）の規則、
    本条は非連鎖方向（共通原因）の規則であり、互いに異なる失敗モードを
    対象とする独立した条項として扱う。

# ---------------------------------------------------------------------
# Open questions (see change spec item 9 — not to be resolved here)
# ---------------------------------------------------------------------
open_questions:
  - "Article 1 の停止根拠を「帰属可能性」で確定してよいか。実務上の反例が
     ないかの確認が必要（未検証のまま採用している）。"
