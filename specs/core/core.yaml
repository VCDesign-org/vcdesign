vcdesign_core:
  version: 2.0

  concept:
    description: >
      VCDesign は、Value Continuity（https://github.com/value-continuity/value-continuity）を
      「判断と責任」の面から実装する方法論である。
      Value Continuity の定義、Value Asymmetry Principle、5原則、Δ、Decision は正本に従い、
      VCDesign では再定義しない。本ファイルは、それを章・責任・Δ・判断・境界・宣言として
      どう実装するかだけを定める。
    skeleton: [残す, 見つける, 閉じる, 試す, 伝える]   # 正本の5原則。policies / metrics もこの順に並べる

  # ---------------------------------------------------------------
  # 1. primitives
  # ---------------------------------------------------------------
  primitives:
    chapter:
      description: 価値を継続させるための責任配置単位。案件（case）は章の中で扱われる
    responsibility:
      description: 章と案件を成立させる主体とその配置（owner / final_decider / custody）
    delta:
      description: 期待（前提と価値）と実際との差。向き（polarity）を持つ。定義は正本の「Δ（期待との差）」
    decision:
      description: Δ を受けて人間が閉じる判断。値は正本の Decision の6語だけを用いる

  # ---------------------------------------------------------------
  # 2. flow
  # ---------------------------------------------------------------
  flow:
    name: PDΔD
    steps: [precondition, do, delta, decision]
    definition:
      precondition: 期待の宣言（前提＝成立条件と責任配置、価値＝value_intent、案件ごとの宣言）
      do: 実行・判断・表示
      delta: 期待との差の観測（向きを付ける）
      decision: 6語のいずれかで閉じ、宣言と状態を更新する

  # ---------------------------------------------------------------
  # 3. delta
  # ---------------------------------------------------------------
  delta:
    levels: [observation, candidate, confirmed]
    rules:
      - transient_noise_is_not_delta
      - sustained_deviation_required
      - responsibility_impact_required   # negative: どの責任配置が崩れるか / positive: 誰が保有するか
    baseline: >
      前提は precondition（章の成立条件と責任配置を含む）、価値は value_intent として宣言する。
      上振れの側の期待は schema_case.spread_signals.expected として追加で宣言できる。
      両方の向きを同じ基準線で観測する。
    polarity:
      negative:
        propagation: 伝播させない
        handling: [localize, mitigate, close_if_needed]
        route: RCA / IDG → boundary containment → decision
      positive:
        propagation: 伝播可能にする
        handling: [observe, interpret, make_reusable]   # 保有者を付けて residual_assets に記録する
        route: 観測 → value_intent に照らした意味づけ → 保有者付きで記録。広げるときは decision expand
    asymmetry_rules:
      - positive_delta_is_never_halted_quarantined_or_blocked
      - positive_delta_is_widened_only_by_decision_expand
      - mixed_observation_is_split_into_separate_positive_and_negative_deltas
    unrecorded_polarity: negative

  # ---------------------------------------------------------------
  # 4. decision（正本 Decision の実装）
  # ---------------------------------------------------------------
  decision:
    values:
      proceed:
        meaning: 現在の構造・現在の宣言のまま進める。章を替えない修正（旧 fix）はここに含む
        next_state: active
      expand:
        meaning: 観測された Positive Δ に基づき、対象・規模・接続を広げる
        requires: [observed_positive_delta, recovery_capability_confirmed, declaration_update]
        next_state: active
      limit:
        meaning: 価値はあるが伝播範囲が広すぎるため、対象・権限・規模・期間を狭める
        requires: [declaration_update]
        next_state: active
      reframe:
        meaning: 価値・対象・境界・前提を再定義し、新しい章として責任を再配置する
        requires: [new_precondition, new_owner, new_declaration]
        next_state: reframed
      defer:
        meaning: 判断材料が揃うまで、責任付きで保留する
        requires: [temporary_owner, next_review_at, defer_reason]
        next_state: deferred
      retire:
        meaning: 次の価値生成につながらないため終了する（開始前の案件では、開始しない判断を含む）
        requires: [release_responsibility, notify_dependents, residual_assets_handover]
        next_state: retired
    rules:
      - decision_is_closed_by_a_human_final_decider
      - expand_and_limit_are_declaration_updates_recorded_as_before_and_after
      - expand_widens_the_declaration_and_limit_narrows_it
      - average_outcome_alone_never_justifies_expand
      - a_trial_without_a_narrowed_declaration_is_not_limit
      - no_other_decision_vocabulary_is_used

  # ---------------------------------------------------------------
  # 5. lifecycle
  # ---------------------------------------------------------------
  lifecycle:
    states: [draft, active, drifting, deferred, reframed, retired]
    rules:
      - a_confirmed_negative_delta_moves_active_to_drifting
      - drifting_must_be_closed_by_a_decision
      - deferred_must_return_by_next_review_at
      - retired_is_recorded_not_hidden

  # ---------------------------------------------------------------
  # 6. declaration（案件ごとの宣言。フィールド定義は schema_case.yaml）
  # ---------------------------------------------------------------
  declaration:
    upside: [value_intent, residual_assets, spread_signals]       # 残す・見つける
    downside: [blast_radius, reversibility, failure_domain, depends_on]  # 閉じる・試す
    continuity: [owner, custody_chain, re_derivation_basis, review_triggers]  # 残す・伝える
    rules:
      - residual_assets_without_a_holder_do_not_remain
      - irreversible_case_must_declare_blast_radius_max_loss
      - undeclared_blast_radius_is_treated_as_high_impact

  # ---------------------------------------------------------------
  # 7. responsibility
  # ---------------------------------------------------------------
  responsibility:
    required: [owner, final_decider]
    constraints:
      - owner_must_exist
      - final_decider_must_be_human
      - owner_change_is_recorded_in_custody_chain
      - responsibility_is_a_scarce_resource   # axioms A5

  # ---------------------------------------------------------------
  # 8. boundary（詳細は patterns/boundary-pattern.yaml）
  # ---------------------------------------------------------------
  boundary:
    rules:
      - losses_are_stopped_by_containment
      - basis_passes_by_basis_flow
      - conclusions_are_revalidated_not_inherited

  # ---------------------------------------------------------------
  # 9. invariants
  # ---------------------------------------------------------------
  invariants:
    - responsibility_must_not_disappear
    - every_confirmed_delta_is_closed_by_a_decision
    - positive_delta_is_not_treated_as_an_anomaly
    - every_decision_has_a_recorded_basis
    - ai_does_not_hold_final_decision   # 拡張：AI 統制（policies.yaml ai_extension）
