vcdesign_core:
  version: 0.1

  concept:
    description: >
      VCDesignは、価値継続を目的とし、
      章と責任の遷移によってシステムを構成する開発OSである。
      現実運用においては、これは物理・意味・価値・責任の
      ループを分離しつつ接続する適応構造として読まれる。

  primitives:

    chapter:
      description: >
        価値を継続させるための責任配置単位

    responsibility:
      description: >
        章を成立させる主体およびその配置

    delta:
      description: >
        開始時に宣言した期待（前提と価値）と、実際に起きたこととの差。定義は Value Continuity 正本に従う。
        期待を下回る方向（Negative Δ）には、章の成立条件または責任配置の維持可能性が崩れた兆候を含む。
        期待を上回る方向（Positive Δ）も Δ として観測する。
        向きの区別と扱いの非対称は delta_definition.polarity に定義する。

    action:
      types:
        - fix
        - reframe
        - defer
        - retire

    supervisor:
      description: >
        責任の消失を防ぎ、最終収束を行う章。
        最終収束点として、すべての deferred 案件をクローズする義務がある。
      implementation_specific: 責任の最終収束点。Value Continuity 正本の5原則には対応せず、判断と責任で実装するための VCDesign 固有の手段

  flow:
    name: PDΔA

    # 継承エッセンス: narrative-model.yaml より
    # 運用の物語: PDΔAサイクルは、システムが「漂流（Drift）」から「回復（Reframe）」するまでのナラティブを構造化したものである。

    steps:
      - precondition
      - do
      - delta
      - action

    definition:
      precondition: 成立条件
      do: 実行・判断・表示
      delta: ズレの観測
      action: 遷移の選択

  reality_fit_definition:
    description: >
      VCDesignが扱う価値継続は、
      現実の運用系においては単一の制御ループではなく、
      異なる時間スケールと責任を持つ複数のループの協調として現れる。

  adaptive_loop_model:
    description: >
      現実適用におけるVCDesign Coreの上位説明。
      PDΔAは各ループで観測・判断・遷移を起こす最小構造であり、
      その統治は責任モデルの下に置かれる。
      4ループ構造は独立した制御モデルではなく、
      PDΔAサイクルを時間スケールと責任配置に沿って分解した表現である。

    implementation_specific: >
      ループの分離と時間定数の分離は、Value Continuity 正本の5原則には直接対応しない。
      AI を含む判断を責任統治の下に置くための VCDesign 固有の手段である。

    loop_layers:
      - id: physical_loop
        name: Physical Loop
        role:
          - stability
          - execution
          - continuous_dynamics
        typical_timescale: ms_to_hours
        relation_to_continuity: preserves_continuous_real_world_stability_and_execution
        relation_to_responsibility: operates_within_constraints_defined_by_higher_responsibility
        allowed_components:
          - sensors
          - actuators
          - transactional_services
          - deterministic_control
        forbidden_components:
          - llm_as_direct_controller
          - autonomous_goal_redefinition
          - final_authority_assignment
        failure_mode: unstable_execution_or_real_world_harm
        relation_to_delta: delta_emerges_as_continuous_deviation_or_operational_instability

      - id: semantic_loop
        name: Semantic Loop
        role:
          - interpretation
          - delta_to_meaning
          - discontinuous_inference
        typical_timescale: seconds_to_days
        relation_to_continuity: translates_continuous_change_into_discrete_meaning
        relation_to_responsibility: supports_human_judgment_but_does_not_own_final_responsibility
        allowed_components:
          - llm
          - classifiers
          - analyzers
          - human_review_tools
        forbidden_components:
          - direct_physical_actuation
          - autonomous_final_decision
          - autonomous_responsibility_assignment
        failure_mode: misinterpretation_or_false_delta_reading
        relation_to_delta: delta_is_interpreted_and_translated_into_candidate_meaning

      - id: value_loop
        name: Value Loop
        role:
          - objective
          - constraints
          - direction_of_optimization
        typical_timescale: days_to_quarters
        relation_to_continuity: defines_what_kind_of_continuity_is_worth_preserving
        relation_to_responsibility: value_revision_requires_explicit_human_review_and_ownership
        allowed_components:
          - policy_models
          - review_boards
          - explicit_goal_definitions
          - human_value_review
        forbidden_components:
          - llm_owned_objective_setting
          - hidden_goal_shift
          - unreviewed_policy_rewrite
        failure_mode: optimization_drift_or_goal_corruption
        relation_to_delta: delta_is_judged_against_stated_value_and_constraints

      - id: responsibility_loop
        name: Responsibility Loop
        role:
          - final_decision
          - halt
          - accountability
        typical_timescale: immediate_to_cross_lifecycle
        relation_to_continuity: preserves_governable_continuity_by_allowing_intervention_and_halt
        relation_to_responsibility: holds_final_human_accountability_for_all_loop_coordination
        governance_note: not_a_computational_loop_but_a_governance_structure_that_can_intervene_in_all_loops
        allowed_components:
          - human_final_decider
          - supervisors
          - audit_logs
          - escalation_paths
        forbidden_components:
          - ai_final_authority
          - untraceable_decision
          - irreversible_action_without_halt_path
        failure_mode: responsibility_loss_or_unstoppable_operation
        relation_to_delta: delta_forces_accountable_judgment_and_action_selection

    temporal_separation:
      principle:
        description: >
          ループごとの時間定数を分離しない限り、
          速い実行系と遅い価値判断系が相互に汚染し、
          誤制御と責任喪失を招く。
      rules:
        - fast_loops_must_not_autonomously_rewrite_slow_loop_constraints
        - semantic_updates_must_not_bypass_value_review
        - value_revision_must_not_bypass_responsibility_judgment
        - responsibility_loop_must_be_able_to_interrupt_all_lower_loops

  long_term_judgment_model:
    description: >
      長期ループにおける判断は、未来予測ではなく、
      予測不可能な世界でも価値継続を壊しにくい判断基準を
      明示することで成立する。

    applies_to:
      - value_loop
      - responsibility_loop
      - structural_reframe
      - irreversible_action
      - long_term_business_or_system_direction

    criteria:
      survive_downside:
        description: 下振れしても致命傷にならないか
        hard_stop_if: false

      within_circle:
        description: 判断主体の能力の輪の内側か
        hard_stop_if: false

      lindy_aspect:
        description: 時間を超えて残った原理・需要・知恵に接続しているか
        hard_stop_if: false_when_reversible
        hard_stop_if_irreversible: true

      compounding_possible:
        description: 価値・信頼・知識が残り、再利用・接続によって次の価値を生むか

      trust_counterparty:
        description: 相手が信頼可能で、責任を共有できるか
        hard_stop_if: low

      learn_asset:
        description: 失敗しても学習資産・判断資産が残るか

      reversible:
        description: 小さく試し、撤退・縮小・修正できるか

      energy_fit:
        description: 判断主体の生活・気力・継続力に合うか
        implementation_specific: 判断主体の継続力を見る VCDesign 固有の基準。正本の5原則には対応しない

    decision_posture:
      high_score: small_go
      medium_score: defer_or_experiment
      low_score: deny_or_reframe

    principle:
      - long_term_decision_must_not_be_treated_as_prediction
      - long_term_decision_must_define_bet_size
      - bet_size_is_declared_as_max_loss_not_only_as_decision_size
      - irreversible_action_requires_human_final_decider
      - ai_may_score_but_must_not_close_long_term_judgment

    note: >
      ここで重要なのは、Go / No-Go ではなく、Go の大きさを決めることです。
      Go の大きさは「どれだけ賭けるか」であると同時に「最大でどこまで失ってよいか」である。
      後者は schema_case.yaml の blast_radius.max_loss として記録する
      （core/downside-containment-model.md 参照）。

  downside_containment:
    description: >
      上振れ（価値の複利・接続による正のフィードバック）は開いたままにし、
      下振れの裾は境界で切る。極端な下振れは、連鎖・再利用・集中・フィードバックによって
      一つの失敗が次の失敗を生むことで起きる。封じ込めは、その増幅を切る 4 機構として定義する。
      分布の数学的な形は主張しない。扱うのは増幅機構の設計である。
      規範的な実体は schema_case.yaml（containment 系フィールド）、
      patterns/boundary-pattern.yaml（containment / revalidation）、
      metrics.yaml（containment_metrics）にある。背景は core/downside-containment-model.md。
      上振れ側は value_accumulation、両者の関係は value_asymmetry を参照。
      Value Continuity 正本の5原則のうち「閉じる」の実装である。
    mechanisms:
      isolate:
        description: 障害区画（failure_domain）を宣言し、区画の外へ失敗が伝播しないようにする（結合を切る）
      cap:
        description: 判断・境界ごとに最大損失（blast radius）を事前に宣言する（上限の宣言）
      revalidate:
        description: >
          判断の受け渡し点（boundary-pattern の Explicit Verification Point）で上流の根拠を再検証し、
          上流の誤りを増幅したまま下流に渡さない（連鎖のリセット）。根拠そのものの流れは止めない（basis_flow）
      deconcentrate:
        description: 判断経路・依存先の一点集中を構造的に検知する（集中を避ける）
    rules:
      - fatal_downside_is_a_hard_stop_regardless_of_owner
      - irreversible_action_requires_declared_max_loss
      - upstream_acceptance_is_not_downstream_acceptance
      - single_owner_is_required_but_single_point_of_dependency_is_detected
    scope_note: >
      外部から来る裾（自然災害・突発故障）は消せない。
      本機構が扱うのは、その事象が内部でどこまで増幅・伝播するかである。

  value_accumulation:
    description: >
      Value Continuity 正本の5原則のうち「残す」と「見つける」の、判断と責任による実装。
      Upside の定義は正本に従う（残ったものが再利用・接続によって次の価値を生むこと）。
      VCDesign は、業務・担当・技術が変わっても残るもの（residual_assets）を保有者付きで宣言し、
      それが再利用・接続されて広がる兆候（tail_signals）を Positive Δ として観測する。
      規範的な実体は schema_case.yaml（residual_assets / tail_signals）、
      metrics.yaml（accumulation_metrics）、policies.yaml（scale_gate）にある。
      背景は core/value-continuity-implementation.md。
    distinction:
      point_improvement:
        description: >
          その時点の業務に紐づく改善。業務が変われば無効化され、何も残らない。
          成果はその場に散らばって消え、継続投資・継続運用の根拠にならない。
      line_improvement:
        description: >
          業務・担当・技術の変化をまたいで残るものに紐づく改善。
          残ったものが再利用されるたびに次の適用が安くなり、成果が次の成果を生む。
    residual_asset_kinds:
      - record          # 記録（履歴・構成・判断ログ）
      - standard        # 標準（手順・受入条件・構成の型）
      - basis           # 判断の根拠（re_derivation_basis を含む）
      - connection      # 接続（他の章・システム・主体とのつながり）
      - capability      # 技能・能力（復旧・変更を実行できる力）
    tail_signals:
      # 広がりの兆候。Positive Δ の観測対象（delta_definition.polarity.positive）。
      # 下記は正本「見つける」の例示に対応する既定の種類であり、網羅ではない。
      # 該当しない兆候は other として記録する。
      reuse_cost_decline:
        description: 同じ仕組みを別の場所に適用するコストが、回を追って下がっている
      unsolicited_pull:
        description: 依頼していない章・部署・主体から適用の引き合いが来る
      output_as_input:
        description: 成果が別の判断・システムの入力として使われ始めている
      value_per_connection:
        description: 接続・利用が増えるほど、一件あたりの価値が上がる
      other:
        description: 上記に当たらないが、再利用・接続によって次の価値を生む兆候（内容と根拠を記録する）
    rules:
      - improvement_must_declare_what_remains_when_work_changes
      - success_on_average_without_tail_signal_does_not_justify_scale
      - scale_requires_observed_tail_signal_and_declared_max_loss
      - improvement_invalidated_by_work_change_is_a_delta

  value_asymmetry:
    principle: "upside は伝播可能にする。downside は伝播させない。"  # Value Asymmetry Principle
    description: >
      Value Continuity と Value Asymmetry Principle の定義は正本
      （https://github.com/value-continuity/value-continuity）にあり、VCDesign は再定義しない。
      VCDesign は、value_accumulation（上）と downside_containment（下）を
      同じ判断記録（schema_case / schema_log）の上で扱い、
      delta_definition.polarity によって両者を非対称に処理することで、この原則を判断と責任の面から実装する。
      背景は core/value-continuity-implementation.md。
    coupling_principles:
      - change_is_bounded_by_recovery_capability
      - recovery_capability_increases_the_number_of_changes_one_can_bet_on
      - declared_max_loss_is_the_budget_for_upside_trials
      - pass_basis_not_conclusion_across_boundaries  # boundary-pattern basis_flow / revalidation
    note: >
      復旧できる範囲でしか変更に賭けない。復旧能力を上げることが、賭けられる回数を増やす。
      下を閉じる仕組みは守りではなく、上に賭けるための原資である。

  boundary_mediation:
    description: >
      AI適用は、非連続な知能出力を連続系へ安全に接続する境界設計問題として扱う。
      Boundaryは変換層であるだけでなく、
      責任の再確認または再配置を明示しなければならない切断点である。
      ここでの Boundary は連続系と離散系の接続点を指す。
      責任境界（B1–B17）や障害区画（failure_domain）との区別は core/glossary.md「Boundary（曖昧さ回避）」を参照。
    implementation_specific: >
      AI 出力を現実系へ接続する境界の要件。正本の5原則のうち「閉じる」に寄与するが、
      AI 適用に固有の VCDesign の手段として置く。
    continuous_to_discrete_boundary:
      description: >
        連続的な現象を意味解釈可能なΔ候補へ変換する境界。
    discrete_to_continuous_boundary:
      description: >
        離散的な判断結果を現実の実行へ反映する前に安全制約へ通す境界。
    requirements:
      - safe_translation_required
      - policy_check_required
      - responsibility_trace_required
      - halt_path_required

  delta_definition:

    levels:
      - observation
      - candidate
      - confirmed

    rules:
      - transient_noise_is_not_delta
      - sustained_deviation_required
      - responsibility_impact_required

    polarity:
      description: >
        Δ と Positive Δ / Negative Δ の定義は Value Continuity 正本（README.md「Δ（期待との差）」）に従う。
        Δ は、開始時に宣言した期待と実際に起きたこととの差であり、期待は前提と価値の両方を含む。
        Negative Δ は伝播させず、Positive Δ は伝播可能にする。Δ を一律に異常と見なさない。
        VCDesign では、期待の前提を precondition（章の成立条件と責任配置を含む）、
        価値を value_intent として宣言し、両方の向きを同じ基準線で観測する。
        上振れの側の期待は、schema_case.tail_signals.expected として追加で宣言できる。
        扱いの区別は正本のシステム設計への適用文書の補足「Positive Δ と Negative Δ を区別する」に対応する。
        levels と rules は両方の向きに共通して適用する。
        responsibility_impact_required は、Negative Δ では「どの責任配置が崩れるか」、
        Positive Δ では「誰がその上振れを保有するか」として評価する。
        向きが記録されていない Δ は negative として扱う（既存の Δ との互換）。
      default: negative
      negative:
        description: >
          期待（前提と価値）を下回る方向の差。VCDesign では、章の成立条件・責任配置・価値が崩れる方向のズレとして現れる。
          基準線は precondition と value_intent。伝播させない。
        handling:
          - localize   # 局所化する（downside_containment isolate / failure_domain）
          - mitigate   # 緩和する（Fix / Defer、blast_radius の範囲内での対処）
          - close      # 必要なら閉じる（Reframe / Retire、halt / quarantine）
        route: RCA / IDG → containment → action（fix / reframe / defer / retire）
      positive:
        description: >
          期待（前提と価値）を上回る方向の差。再利用・接続・引き合いなど、次の価値を生む兆候として現れる。
          基準線は precondition と value_intent（Negative Δ と同じ）。上振れの側の期待を
          schema_case.tail_signals.expected として宣言した場合は、それも基準線に含める。
          tail_signals.expected に宣言していなかった兆候も、期待を上回る差であれば Positive Δ として観測する
          （tail_signals.unexpected）。伝播可能にする。
        handling:
          - observe            # 観測する（semantic loop。AI は証拠収集を支援してよい）
          - interpret          # 意味づけする（value loop。value_intent に照らして人が判断する）
          - make_reusable      # 再利用可能にする（responsibility loop。residual_assets に holder 付きで記録する）
        route: >
          observe → interpret → make_reusable。広げる場合は decision expand として
          policies.yaml scale_gate を通す。原因が特定できない上振れは IDG で UNKNOWN とし、
          拡大の根拠にしない（勢いによる拡大を止める）。
      asymmetry_rules:
        - positive_delta_must_not_trigger_halt_or_quarantine
        - positive_delta_must_not_be_routed_to_containment
        - positive_delta_must_not_be_discarded_as_noise_without_record
        - positive_delta_requires_a_holder_or_it_does_not_remain
        - positive_delta_expands_only_through_scale_gate_within_declared_max_loss
        - mixed_observation_must_be_split_into_separate_positive_and_negative_deltas
        - closing_a_negative_delta_does_not_close_its_positive_counterpart
      mixed_observation_example: >
        依頼していない部署から利用の引き合いが来たが、その利用が blast_radius.scope の外に及ぶ場合、
        引き合い（Positive Δ, unsolicited_pull）と範囲外の影響（Negative Δ）を別の Δ として記録する。
        後者を閉じても、前者の観測と保有は閉じない。

  action_definition:

    fix:
      description: >
        現在の章を維持したまま修正する

    reframe:
      description: >
        新しい章を生成し責任を再配置する

    defer:
      description: >
        責任を上位章へ移送し保留する

    retire:
      description: >
        価値継続を意図的に終了する

    note: >
      action は章のライフサイクル上の遷移である。判断の選択肢（decision）とは別の軸であり、
      両者の対応は decision_vocabulary に定義する。

  decision_vocabulary:
    description: >
      判断の選択肢には Value Continuity 正本の Decision
      （Proceed / Expand / Reframe / Limit / Defer / Retire）を用いる。各値の定義は正本に従う。
      本セクションは、それを VCDesign の既存語彙と記録にどう対応させるかを定める。
      decision は schema_log.yaml decision に記録する。action（遷移）とは別に記録し、
      既存の語彙（decision posture / decision_size / 長期判断の姿勢 / scale_gate outcomes）は改名しない。
      mapping の値が複数ある場合は、文脈によってどちらにも当たることを示す。none は対応する値がないことを示す。
    values:
      proceed:
        action: none_or_fix
        decision_posture: commit
        decision_size: small_go
        long_term_posture: high_score
        scale_gate_outcome: average_success_without_tail_signal  # keep_small の側
        blast_radius: 現在の宣言を維持する
      expand:
        action: none
        decision_posture: none
        decision_size: scale_go
        long_term_posture: none
        scale_gate_outcome: tail_signal_observed
        blast_radius: >
          拡大後の scope と max_loss で再宣言し、approved_by を更新する。
          reversibility も拡大後の範囲で再確認する（scale_gate.recovery_capability_confirmed）。
        requires:
          - policies.yaml scale_gate
          - observed_positive_delta   # tail_signals.observed または unexpected
      reframe:
        action: reframe
        decision_posture: reconsider   # reconsider は再検討の段階。再定義が確定したら reframe
        decision_size: none
        long_term_posture: low_score   # deny_or_reframe の reframe の側
        scale_gate_outcome: no_success_with_tail_signal
        blast_radius: 新しい章の前提に合わせて宣言し直す
      limit:
        definition: >
          blast_radius を狭める宣言更新を伴う判断。
          宣言更新を伴わない small_go は Limit ではなく Proceed として記録する。
        action: none_or_fix
        decision_posture: commit       # 狭めた範囲での commit
        decision_size: small_go        # blast_radius を狭める宣言更新を伴う small_go
        long_term_posture: medium_score  # defer_or_experiment のうち、狭めた blast_radius の宣言があるもの
        scale_gate_outcome: average_success_without_tail_signal  # keep_small の側
        blast_radius: >
          scope（対象・権限）または max_loss（規模）を縮めて再宣言する（必須）。
          期間の限定は reversibility.reversal_window または resolution の expiry で表す。
          権限の限定は B17（Impact ↔ Accountability）の宣言と一致させる。
      defer:
        action: defer
        decision_posture: defer
        decision_size: defer
        long_term_posture: medium_score  # defer_or_experiment のうち、狭めた blast_radius の宣言がないもの
        scale_gate_outcome: none
        blast_radius: 保留中は現在の宣言を維持する
      retire:
        action: retire
        decision_posture: abandon
        decision_size: no_go           # 開始前の案件では no_go が Retire（開始しない判断）に対応する
        long_term_posture: low_score   # deny_or_reframe の deny の側
        scale_gate_outcome: neither    # average_success_without_tail_signal の retire の側も含む
        blast_radius: 解除し、retire_control に従って責任を解放する
    rules:
      - decision_is_recorded_separately_from_action
      - expand_and_limit_must_update_blast_radius_declaration
      - expand_requires_scale_gate_and_observed_positive_delta
      - average_outcome_alone_does_not_justify_expand
      - limit_is_a_scope_decision_not_a_halt
      - limit_requires_a_narrowing_update_of_blast_radius
      - small_go_without_narrowing_update_is_recorded_as_proceed
      - defer_or_experiment_is_recorded_as_limit_if_a_narrowed_blast_radius_is_declared_otherwise_as_defer
      - decision_is_closed_by_human_final_decider
    long_term_posture_resolution:
      defer_or_experiment: >
        長期判断の姿勢 defer_or_experiment は、一つの Decision に確定させて記録する。
        狭めた blast_radius の宣言（scope または max_loss を縮めた再宣言と approved_by）があれば limit、
        なければ defer として schema_log.yaml decision に記録する。
        宣言のない「実験」は、上限のない試行になるため limit として扱わない。
    note: >
      Expand と Limit には対応する action がない。いずれも章を替えずに、
      blast_radius の宣言（どこまで広げてよいか・どこまでに留めるか）を更新する判断として定義する。

  responsibility_model:

    implementation_specific: >
      責任主体の必須化と AI の非責任は、Value Continuity 正本の5原則には直接対応しない。
      正本を判断と責任の面から実装するための VCDesign 固有の前提である。

    required_fields:
      - owner
      - supporters
      - final_decider

    constraints:
      - owner_must_exist
      - final_decider_must_be_human
      - ai_cannot_be_final_decider

  lifecycle:

    states:
      - draft
      - active
      - drifting
      - deferred
      - fixed
      - reframed
      - retired

    transitions:
      drifting:
        - fix
        - reframe
        - defer
        - retire

  responsibility_metrics:

    base_metrics:
      - owner_missing
      - owner_conflict
      - ai_overreach
      - unresolved_duration_exceeded
      - promise_broken

    description: >
      責任状態の異常を検出する指標群

  constraints:

    implementation_specific: AI の利用範囲の制約。正本の5原則には対応しない VCDesign 固有の手段

    ai_usage:
      allowed:
        - analysis
        - suggestion
        - pattern_detection

      forbidden:
        - final_decision
        - responsibility_assignment
        - direct_physical_control
        - autonomous_value_redefinition

  invariants:

    - responsibility_must_not_disappear
    - every_defer_must_have_owner
    - every_chapter_must_be_explainable
    - delta_must_trigger_evaluation
    - adaptive_loops_must_remain_under_responsibility_governance
    - boundary_mediation_must_exist_between_discontinuous_inference_and_continuous_control
    - capability_must_not_be_confused_with_authority
    - high_speed_loops_must_not_rewrite_governance_without_explicit_review

  final_definition:
    description: >
      AIとは、非連続な知能を連続系へ安全接続するための境界設計問題である。
      自律的成長とは、異なる時間スケールのループ群が
      責任統治の下で協調し、運用整合を改善し続ける適応構造である。
    implementation_specific: >
      AI と自律的成長についての VCDesign 固有の定義。Value Continuity の定義ではない
      （Value Continuity の定義は正本にある）。
