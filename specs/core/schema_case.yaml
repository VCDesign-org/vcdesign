vcdesign_case:
  version: 0.3

  concept:
    description: >
      case は、章の中で生成・観測・処理され、
      必要に応じて章間を移送される責任付き案件である。
      version 0.2 で、承認の一点（Gate）だけでなく
      承認後の継続保有（Tenure）を記録する optional フィールド群を追加した。
      背景は core/value-tenure-model.md を参照。
      version 0.3 で、下振れの裾を切るための宣言フィールド群
      （blast_radius / reversibility / failure_domain / upstream_basis_refs / depends_on）を
      optional として追加した。背景は core/downside-containment-model.md を参照。

  required_fields:
    - case_id
    - chapter_id
    - delta_level
    - metrics_snapshot
    - current_state
    - owner
    - final_decider
    - action_history

  optional_fields:
    - temporary_owner
    - next_review_at
    - deadline
    - related_case_ids
    - tags
    # tenure fields (v0.2): 承認後の継続責任を記録する。value-tenure-model.md 参照
    - value_intent
    - original_author
    - custody_chain
    - re_derivation_basis
    - review_triggers
    - last_reaffirmed
    # containment fields (v0.3): 下振れの裾を切る宣言。downside-containment-model.md 参照
    - blast_radius
    - reversibility
    - failure_domain
    - upstream_basis_refs
    - depends_on

  field_definitions:

    case_id:
      type: string
      description: 一意な案件ID

    chapter_id:
      type: string
      description: 現在この案件を扱っている章ID

    delta_level:
      type: enum
      values:
        - observation
        - candidate
        - confirmed
      description: Δの確度レベル

    metrics_snapshot:
      type: object
      description: >
        観測時点の responsibility_metrics と evidence のスナップショット

    current_state:
      type: enum
      values:
        - draft
        - active
        - drifting
        - deferred
        - fixed
        - reframed
        - retired
      description: 案件の現在状態

    owner:
      type: object
      description: 現在の実行責任主体

    temporary_owner:
      type: object
      description: Defer時などの暫定責任主体

    final_decider:
      type: object
      description: 最終判断責任主体

    next_review_at:
      type: datetime
      description: 次回レビュー時刻

    deadline:
      type: datetime
      description: この案件の許容最終期限

    action_history:
      type: array
      description: >
        Fix / Reframe / Defer / Retire を含む遷移履歴

    value_intent:
      type: string
      description: >
        この案件（またはその根拠となった決定）が生かし続けようとしている価値。
        ドリフト（価値からのズレ）判定の基準線。
        これが無い場合、Δ評価は前提条件のズレしか観測できない。

    original_author:
      type: object
      description: >
        原起案者と起案時点。履歴として固定され、以後変更しない。
        現在の責任保有者は owner が表す（owner は交代しうる）。

    custody_chain:
      type: array
      description: >
        責任の継承履歴。owner の交代が起きるたびに追記する（append-only）。
        temporal-governance.md の責任イベントとして扱い、削除・上書きしない。
      item_fields:
        from: 引き渡し元の責任主体
        to: 引き受け先の責任主体
        date: 引き渡し日時
        reason: 交代理由（異動・退職・再編・過負荷再配分 等）
        re_derivation_confirmed: >
          引き受け先が re_derivation_basis から判断を
          再導出できることを確認したか（yes / no / partial）

    re_derivation_basis:
      type: object
      description: >
        後任がこの判断を再導出するために必要な前提・文脈・根拠。
        「何を決めたか」ではなく「なぜそう判断できたか」を、
        原決定者がいなくても辿れる形で残す。

    review_triggers:
      type: array
      description: >
        見直しが必要になる「条件」。時間経過ではなく事象で書く。
        next_review_at が「いつ見るか」であるのに対し、
        review_triggers は「何が変われば見るべきか」を定義する。
        例: 依存ベンダーの変更、前提としていた規制の改定、
        利用者構成の閾値超過、モデル・基盤の入れ替え。

    last_reaffirmed:
      type: object
      description: >
        最後に「この判断は今も有効」と確認された記録。
        Tenure は放置で減衰するため、by（確認者）と at（時刻）を持つ。
        再確認の義務は事象駆動である（custody 交代時・review_trigger 発火時に必須）。
        時間経過のみによる減衰は弱いシグナル（observation）として扱い、
        定期打刻を強制しない。カレンダー駆動の再確認義務は、
        review_triggers で退けた儀式化を reaffirmation に移すだけだからである。
      fields:
        by: 確認した責任主体
        at: 確認時刻
        basis: 確認の根拠（review_trigger の評価結果 等）

    # ---- containment fields (v0.3) ----

    blast_radius:
      type: object
      description: >
        この案件の判断が失敗した場合に「最大でどこまで壊れてよいか」の事前宣言（上限の宣言）。
        scope が影響の範囲を表すのに対し、max_loss は損失の大きさの上限を表す。
        長期判断の bet_size はこの max_loss の一種である。
        未宣言の場合、その判断は high_impact として扱う。
      fields:
        scope: 影響が及んでよい範囲（例 "line_3 only"）
        max_loss:
          unit: 損失の単位（hours_downtime / JPY / records / units 等、章で定義）
          value: 上限値
        declared_by: 宣言した責任主体
        approved_by: 上限を承認した責任主体（final_decider と同一でもよい）
        on_exceed: 上限超過時の動作（halt / quarantine / escalate）

    reversibility:
      type: object
      description: >
        判断を撤回・縮小・修正できるかの宣言。
        policies.yaml の reversibility_assessed は、このフィールドが埋まっていることで満たされる。
        システム状態の巻き戻しと責任記録の扱いは policies/temporal-governance.md に従う
        （状態は戻せるが、責任記録は追記のみ）。
      fields:
        class:
          type: enum
          values:
            - reversible
            - costly
            - irreversible
        reversal_path: 撤回の技術的・運用的手段
        reversal_window: いつまで撤回できるか（例 "24h"、irreversible の場合は none）
        reversal_owner: 撤回を実行・判断する責任主体

    failure_domain:
      type: string
      description: >
        この案件が属する障害区画（結合を切る）。
        同じ failure_domain の外へ失敗を伝播させないことが境界の責務になる。
        patterns/boundary-pattern.yaml の containment.failure_domain と対応する。

    upstream_basis_refs:
      type: array
      description: >
        この案件が前提として受け取った上流の判断と、境界での再検証結果（連鎖のリセット）。
        上流で ACCEPTED だったことは、下流で ACCEPTED であることを意味しない。
      item_fields:
        case_id: 上流の案件ID
        revalidated_at_boundary: 再検証した境界ID
        result: yes / no / partial

    depends_on:
      type: array
      description: >
        この案件が依存する共通資源・外部主体・判断経路（集中を避ける）。
        同じ依存先を多数の案件が共有していることは metrics.yaml の
        dependency_concentration で検知する。
        owner が 1 人であること（A5 single_owner_per_delta）は義務であり、
        依存や判断経路が一点に集まることとは区別する。

  invariants:
    - every_case_must_have_owner_or_temporary_owner
    - deferred_case_must_have_next_review_at
    - every_case_must_be_traceable
    - action_history_must_not_be_empty_once_delta_confirmed
    # tenure invariants (v0.2)
    - owner_change_must_append_custody_chain_entry
    - custody_chain_must_be_append_only
    - review_triggers_must_be_event_based_not_calendar_based
    - case_with_custody_chain_must_have_re_derivation_basis
    - reaffirmation_is_required_on_custody_transfer_and_trigger_fire_not_on_calendar
    # containment invariants (v0.3)
    - irreversible_case_must_declare_blast_radius_max_loss
    - case_without_blast_radius_is_treated_as_high_impact
    - upstream_acceptance_must_not_be_inherited_without_revalidation