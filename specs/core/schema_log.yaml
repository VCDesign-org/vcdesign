vcdesign_decision_log:
  version: 1.0

  concept:
    description: >
      decision_log は、Δ の評価と判断の根拠を記録する監査証跡である。
      判断の語彙は Value Continuity の6語だけを用いる。
      根拠は結論ではなく、次の判断や後任が再判断できる形で残す（伝える）。

  required_fields:
    - log_id
    - case_id
    - chapter_id
    - recorded_at
    - why_delta
    - decision
    - policy_applied

  field_definitions:

    log_id: {type: string}
    case_id: {type: string}
    chapter_id: {type: string}
    recorded_at: {type: datetime}

    why_delta:
      type: object
      description: どの兆候・指標・根拠により、どちらの向きの Δ と判断したか
      fields:
        polarity: negative / positive
        evidence: 観測と根拠
        metrics: 参照した metric_id

    decision:
      type: object
      fields:
        value: proceed / expand / limit / reframe / defer / retire
        basis:
          description: >
            判断の根拠。Value Continuity の Review Output の観点で書く。
          fields:
            upside: 何が次の価値へつながるか、何が残るか
            downside: 最大損失、伝播範囲、止める場所、撤回の可否
            continuity: 業務・人・技術が変わった後に何が残るか
            asymmetry: 上を開く仕組みと下を閉じる仕組みが両立しているか
        positive_delta_refs:
          description: expand の根拠とした Positive Δ（spread_signals.observed / unexpected）
        declaration_update:
          description: expand / limit では必須。blast_radius の before / after
          fields: {before: 更新前, after: 更新後}
        decided_by: 判断を閉じた人間

    policy_applied:
      type: array
      description: 適用された policy と enforcement level（advisory / warning / blocking）

    evaluator: {type: object, description: 評価の主体（human / ai / system）}
    ai_involvement: {type: object, description: AI が関与した場合の役割と範囲（policies.yaml ai_extension）}
    confidence: {type: number}
    notes: {type: string}

    tenure_event:
      type: object
      description: 責任の継続保有に関わるイベント。上書きせず新しいログとして追記する
      fields:
        event_type: custody_transfer / reaffirmation / review_trigger_fired
        case_ref: 対象 case_id
        detail: >
          custody_transfer は from / to / reason / re_derivation_confirmed。
          reaffirmation は by / basis。review_trigger_fired は fired_trigger / evaluation / resulting_decision。

  invariants:
    - every_confirmed_delta_has_a_decision_log
    - every_decision_has_a_basis
    - expand_and_limit_record_declaration_update
    - expand_references_an_observed_positive_delta
    - decided_by_is_human
    - every_custody_transfer_has_a_log
    - reaffirmation_names_a_human_confirmer
