vcdesign_policies:
  version: 2.0

  concept:
    description: >
      policies は、core.yaml の判断と責任に対する不可侵の制約である。
      芯は判断ゲート1つと、責任・説明・停止の規則。
      AI 統制は VCDesign 固有の強みとして、芯の外の拡張（ai_extension）に置く。

  # ===============================================================
  # 芯
  # ===============================================================

  judgment_gate:
    principle: >
      すべての decision は、この一つのゲートを通って人間が閉じる。
      確認項目は Value Continuity 正本の Review Output（Upside / Downside / Continuity / Asymmetry / Decision）に従う。
      長期か短期かは確認の深さの違いであり、別のゲートを設けない。

    review:  # 5原則の順
      残す: [value_intent_declared, residual_assets_declared_with_holder]
      見つける: [spread_signals_expected_declared, positive_delta_recorded_separately_from_average_outcome]
      閉じる: [blast_radius_declared, failure_domain_declared_if_shared, upstream_conclusions_revalidated]
      試す: [reversibility_declared, halt_path_confirmed]
      伝える: [decision_basis_recorded, re_derivation_basis_recorded_if_long_lived]

    per_decision:
      proceed: []
      expand:
        - observed_positive_delta           # spread_signals.observed または unexpected
        - recovery_capability_confirmed     # 拡大後の範囲でも reversibility が成り立つ
        - declaration_widened_before_after  # blast_radius の before / after
      limit:
        - declaration_narrowed_before_after
      reframe:
        - existing_chapter_not_sustainable
        - new_precondition_and_boundary_defined
        - new_owner_assigned
        - supervisor_approval_if_structural
      defer:
        - defer_reason
        - temporary_owner
        - next_review_at                    # 既定の上限 7d。超過したら supervisor が closing を強制する
      retire:
        - no_hidden_dependency
        - responsibility_released
        - related_chapters_notified
        - residual_assets_handed_over       # 終了しても残すものは保有者を移す

    hard_stops:  # Negative Δ に対してのみ適用する
      - fatal_downside                      # 責任者の有無によらない
      - no_owner
      - no_human_final_decider
      - irreversible_without_declared_max_loss
      - expand_without_observed_positive_delta
      - expand_beyond_recovery_capability

    anti_patterns:
      - expand_on_average_success_only
      - trial_without_declaration           # 上限のない「実験」
      - defer_without_owner_or_review
      - retire_hiding_active_dependencies

  responsibility_rules:
    invariants:
      - responsibility_must_not_disappear
      - every_chapter_must_have_owner
      - final_decider_must_be_human
    conflict_resolution:
      priority: [supervisor, final_decider, owner]
    reassignment:
      - must_be_explicit
      - must_be_recorded_in_custody_chain
      - must_define_scope

  explainability:
    principle: >
      すべての判断は人間に説明可能でなければならない。内部推論の完全な透明性は求めないが、
      判断の根拠・責任経路・停止条件の説明は必須である。
    levels:
      low_impact: {when: 局所的かつ可逆, requires: [decision_basis]}
      medium_impact: {when: 複数ステップ、または外部への書き込み, requires: [decision_basis, delta_to_decision_trace]}
      high_impact:
        when: 不可逆、組織外への影響、権限境界付近、または blast_radius 未宣言
        requires: [decision_basis, delta_to_decision_trace, responsibility_path, halt_condition]
    failure: 説明不能な判断は、Value Continuity を満たさないとみなす

  haltability:
    principle: 停止可能性は責任統治の成立条件である
    rules:
      - every_operational_path_has_a_named_halt_owner
      - emergency_stop_bypasses_nonessential_automation
      - human_override_works_under_degraded_conditions
      - rollback_or_safe_state_is_defined
      - post_halt_review_records_reason_and_responsibility

  enforcement:
    levels: [advisory, warning, blocking]
    rules:
      - blocking_applies_to_negative_delta_only
      - positive_delta_is_at_most_warning
      - a_missing_expand_precondition_blocks_the_expand_not_the_observation
    examples:
      missing_owner: blocking
      missing_halt_path: blocking
      ai_final_decision: blocking
      missing_decision_basis: warning

  # ===============================================================
  # 拡張：AI 統制（VCDesign 固有。正本の5原則の外側）
  # ===============================================================

  ai_extension:
    principle: >
      AI は判断を支援するが、責任を持たない。能力の大きさは権限を意味しない。

    ai_governance:
      allowed: [analysis, pattern_detection, recommendation, anomaly_detection, spread_signal_evidence_collection]
      allowed_with_review: [auto_classification, prioritization]
      forbidden: [final_decision, responsibility_assignment, reframe_execution, retire_execution, expand_execution]
      constraints:
        - human_in_decision_loop
        - ai_output_explainable_and_confidence_visible
        - model_capability_does_not_imply_authority

    llm_placement:
      allowed_in: [semantic_loop]
      forbidden_direct_control: [physical_loop, value_loop, responsibility_loop]
      rule: llm_outputs_require_an_explicit_gate_before_real_world_effect

    loops:  # 各ループで許される構成要素と禁じられる構成要素。説明は docs/ai-adaptive-loop-model.md
      physical_loop:
        timescale: ms_to_hours
        allowed: [sensors, actuators, transactional_services, deterministic_control]
        forbidden: [llm_as_direct_controller, autonomous_goal_redefinition, final_authority_assignment]
      semantic_loop:
        timescale: seconds_to_days
        allowed: [llm, classifiers, analyzers, human_review_tools]
        forbidden: [direct_physical_actuation, autonomous_final_decision, autonomous_responsibility_assignment]
      value_loop:
        timescale: days_to_quarters
        allowed: [policy_models, review_boards, explicit_goal_definitions, human_value_review]
        forbidden: [llm_owned_objective_setting, hidden_goal_shift, unreviewed_policy_rewrite]
      responsibility_loop:
        timescale: immediate_to_cross_lifecycle
        allowed: [human_final_decider, supervisors, audit_logs, escalation_paths]
        forbidden: [ai_final_authority, untraceable_decision, irreversible_action_without_halt_path]

    temporal_separation:  # axioms A4。ループ構造の説明は docs/ai-adaptive-loop-model.md
      rules:
        - fast_loops_do_not_rewrite_slow_loop_constraints
        - semantic_updates_do_not_bypass_value_review
        - responsibility_loop_can_interrupt_all_lower_loops

    agent_execution_gate:
      principle: 計画が合理的であることと、実行が許可されていることは別である
      required_checks:
        - action_within_declared_authority   # B17 Impact ↔ Accountability
        - responsible_actor_identified
        - reversibility_declared
        - blast_radius_declared_if_irreversible
        - halt_owner_named_before_start
      anti_patterns:
        - direct_llm_to_actuator_path
        - silent_goal_rewrite
        - agent_plan_treated_as_execution_approval

    supervisor_role:
      principle: 責任の最終収束点であり、責任の消失を防ぐ
      responsibilities: [accept_deferred_cases, approve_structural_reframe, approve_retire, resolve_conflicts]
      constraints:
        - supervisor_does_not_delegate_final_decision_to_ai
        - supervisor_closes_or_reassigns_every_case
