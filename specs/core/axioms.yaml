meta:
  id: VCDESIGN_AXIOMS
  title: VCDesign Core Axioms
  layer: core
  status: stable
  version: 2.0.0
  authority: normative

purpose: >
  Axioms are the irreducible commitments of VCDesign as an implementation of
  Value Continuity on the side of judgment and responsibility.
  An implementation that violates an axiom is non-conforming regardless of
  how well it satisfies other specs.

axioms:

  A1:
    id: A1
    label: Responsibility Must Not Disappear
    statement: >
      Every Delta, negative or positive, must be assigned to an explicit owner.
      For a Negative Delta the owner closes it; for a Positive Delta the owner
      holds what it produced so that it remains. Responsibility may be
      transferred or released, but it may not silently become unowned.
    corollary: >
      If an owner cannot be identified for a Negative Delta, the system halts or
      escalates rather than proceeding. A Positive Delta without a holder is not
      halted; it is recorded as not yet held.
    conformance_test: >
      For every confirmed Delta: is there a named owner (or holder) in the case?

  A2:
    id: A2
    label: Execution Stays Within a Scope Authorized by a Human Decision
    statement: >
      No execution may exceed the scope authorized by a decision closed by a
      human. Within that scope, loops may act autonomously as often as needed;
      a change that would exceed it is observed as a Delta and re-decided.
      Every boundary crossing has a guard verdict. A verdict of unknown stops
      and escalates; it is never treated as pass.
    corollary: >
      Operational pressure, time constraints, or automation momentum do not
      override this axiom.
    conformance_test: >
      For every execution: does it fall within the declared scope of a decision
      closed by a human, and did it receive a pass verdict at each boundary it
      crossed?

  A3:
    id: A3
    label: AI Does Not Hold Final Responsibility
    statement: >
      AI systems may propose, analyze, and detect. They may not hold, accept, or
      assign final responsibility. The final_decider of every decision is human.
    corollary: >
      Whatever an AI produces about a case is a proposal until a human closes
      the decision.
    conformance_test: >
      For every decision: is decided_by a human role or person?

  A4:
    id: A4
    label: Temporal Separation Is Inviolable
    statement: >
      Fast loops (physical, semantic) must not autonomously rewrite constraints
      defined by slow loops (value, responsibility) without explicit re-judgment
      at the appropriate level.
    conformance_test: >
      For every cross-loop change: was the slow-loop owner given the opportunity
      to close a judgment first?

  A5:
    id: A5
    label: Responsibility Is a Scarce Resource
    statement: >
      An actor's capacity to hold and honor responsibility is finite.
      Overloading a responsible actor degrades every judgment they hold.
    rules:
      - single_owner_per_delta: each active Delta has exactly one named owner
      - capacity_check_before_assignment: assignment that knowingly exceeds capacity is a design error
      - supervisor_as_overflow_holder: the supervisor may hold a Delta temporarily but must redistribute or escalate within one review cycle
      - capacity_exhaustion_halts: if no actor can own a Delta that cannot be deferred, the affected chapter halts until the final_decider authorizes new capacity or decides retire
    signals: [stagnation, operator_overload]   # metrics.yaml
    conformance_test: >
      For every actor with active Deltas: is their load within declared capacity?

hierarchy_note: >
  When axioms appear to conflict, the resolution order is A2 > A3 > A1 > A4 > A5.
  Apparent conflicts are resolved by the supervisor or final_decider, never by
  silently overriding either axiom.

normative_links:
  - id: core.yaml
    relation: "invariants instantiate the axioms"
  - id: policies.yaml
    relation: "judgment_gate and the AI extension enforce A2–A5"
  - id: metrics.yaml
    relation: "owner_missing, stagnation and operator_overload operationalize A1 and A5"
