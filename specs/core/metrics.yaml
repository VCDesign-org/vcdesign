vcdesign_metrics:
  version: 2.0
  concept: >
    metrics は Δ の観測装置であり、判断の入力である。判断を置き換えない。
    芯の指標は Value Continuity 正本の5原則の順に並べる。AI 統制の指標は拡張として分ける。
  evaluation_model:
    levels: [observation, warning, delta_candidate, delta_confirmed]
    rules:
      - single_observation_is_not_always_delta
      - sustained_or_repeated_condition_required
      - responsibility_impact_must_be_considered
      - domain_chapter_may_extend_metrics
    polarity:
      values: [negative, positive, none]
      default: negative
      rules:
        - positive_metric_never_forces_halt_or_blocking
        - positive_metric_max_level_is_warning
        - none_means_an_input_to_the_judgment_gate_not_a_delta

  # 各指標: principle / polarity（既定 negative）/ detects / signals / threshold / decisions
  core_metrics:

    # ---- 残す ----
    - id: owner_missing
      principle: 残す
      detects: 章の owner が不在、未割当、または事実上機能していない状態。
      signals: [no_responsible_actor_assigned, assigned_owner_not_acting, work_items_accumulating_without_action]
      threshold: "duration_or_backlog / duration=24h, backlog_count=10"
      decisions: [defer, reframe, proceed]
    - id: custody_gap
      principle: 残す
      detects: >
        責任保有者の交代が起きたにもかかわらず、custody_chain への追記（引き渡しの責任イベント）が存在しない状態。または引き受け先が re_derivation_basis を確認しないまま保有が始まった状態。
      signals: [owner_changed_without_custody_chain_entry, custody_entry_without_re_derivation_confirmation, departed_actor_still_recorded_as_owner]
      threshold: "immediate"
      decisions: [proceed, defer]
    - id: one_shot_improvement
      principle: 残す
      detects: >
        業務・担当・技術の変化によって改善が無効化され、何も残らなかった状態。または residual_assets を宣言しないまま改善が完了扱いになった状態。
      signals: [improvement_lost_after_work_change, improvement_completed_without_residual_assets, residual_asset_without_holder]
      threshold: "event"
      decisions: [reframe, retire]
    - id: positive_delta_without_holder
      principle: 残す
      detects: >
        Positive Δ が観測されたが、それを residual_assets として保有する主体（holder）が決まっていない状態。
      signals: [observed_spread_signal_without_residual_asset, residual_asset_without_holder_after_positive_delta]
      threshold: "at_review"
      decisions: [proceed, defer]

    # ---- 見つける ----
    - id: spread_signal_observed
      principle: 見つける
      polarity: positive
      detects: >
        宣言した spread_signals.expected、または宣言していなかった兆候（spread_signals.unexpected）が観測された状態。Positive Δ の検知である。
      signals: [expected_spread_signal_observed, unexpected_reuse_or_pull_observed, output_used_as_input_by_other_chapter]
      threshold: "event"
      max_level: warning
      decisions: [expand, proceed]
    - id: success_without_spread_signal
      principle: 見つける
      polarity: none
      detects: >
        平均的な効果は出た（average_outcome が met）が、宣言した spread_signals が一つも観測されない状態。
      signals: [average_outcome_met_but_no_observed_spread_signal, expand_proposed_on_average_success_only]
      threshold: "at_review"
      max_level: warning
      decisions: [defer, retire]
    - id: reuse_cost_trend
      principle: 見つける
      polarity: positive
      detects: >
        同じ residual_asset を別の章・場所に適用するコスト（工数・期間・例外対応）の推移。下がっていれば複利が効いている。下がらない、または上がっている場合は、残ったものが再利用に耐えていない。
      signals: [nth_application_cost_not_decreasing, each_application_requires_redesign]
      threshold: "trend / applications_compared=3"
      max_level: warning
      decisions: [proceed, reframe]

    # ---- 閉じる ----
    - id: precondition_broken
      principle: 閉じる
      detects: Pで定義された成立条件、禁止条件、引き受け条件が破られた状態。
      signals: [required_input_missing, forbidden_operation_detected, precondition_no_longer_true]
      threshold: "immediate_or_confirmed / immediate=True"
      decisions: [proceed, reframe, retire]
    - id: blast_radius_undeclared
      principle: 閉じる
      detects: >
        irreversible または costly な判断が、blast_radius.max_loss を宣言しないまま 実行・承認された状態。
      signals: [irreversible_case_without_max_loss, resolution_without_blast_radius_on_irreversible_action, irreversible_decision_without_max_loss]
      threshold: "immediate"
      decisions: [proceed, defer]
    - id: blast_radius_exceeded
      principle: 閉じる
      detects: 実際の損失または影響範囲が、宣言された blast_radius を超えた状態。
      signals: [observed_loss_above_max_loss, impact_outside_declared_scope, propagation_outside_failure_domain]
      threshold: "immediate"
      decisions: [proceed, reframe]
    - id: transitive_trust
      principle: 閉じる
      detects: 上流で閉じた判断の結論が、境界で確かめ直されないまま下流でも前提として扱われている状態。
      signals: [upstream_basis_refs_without_revalidation_result, boundary_upstream_trust_undeclared, downstream_acceptance_copied_from_upstream]
      threshold: "repeated_or_rate / unrevalidated_ratio=0.2"
      decisions: [proceed, reframe]
    - id: concentration
      principle: 閉じる
      detects: >
        多数の案件・境界が、同一の依存先（共通資源・外部主体・基盤）または同一の判断経路（final_decider・境界の guard）を共有している状態。
      kinds: [dependency, judgment]
      signals: [same_dependency_across_many_failure_domains, shared_dependency_crossing_bulkhead, single_final_decider_across_failure_domains]
      threshold: "ratio / shared_ratio=0.5"
      decisions: [reframe, proceed]

    # ---- 試す ----
    - id: expand_beyond_recovery
      principle: 試す
      detects: 適用範囲の拡大に、復旧・撤回できる能力（reversibility / 復旧手順 / 技能）が追いついていない状態。
      signals: [expand_without_recovery_capability_confirmed, applications_growing_faster_than_recovery_capability, change_avoided_because_recovery_uncertain]
      threshold: "immediate"
      decisions: [proceed, defer]
    - id: halt_readiness
      principle: 試す
      detects: 停止命令、人間介入、安全退避が実際に発動可能な状態に保たれている度合い。
      signals: [halt_drill_success_rate, emergency_stop_latency, override_path_availability]

    # ---- 伝える ----
    - id: decision_without_basis
      principle: 伝える
      detects: >
        decision が記録されているが、その根拠（Upside / Downside / Continuity / Asymmetry の観点）が記録されていない、または結論だけが下流や後任に渡されている状態。
      signals: [decision_log_without_basis, conclusion_passed_downstream_without_basis, successor_cannot_re_derive]
      threshold: "event"
      decisions: [proceed, defer]
    - id: review_trigger_missing
      principle: 伝える
      detects: >
        長期継続する active 案件が、事象駆動の review_triggers を持たず、カレンダー駆動の next_review_at のみ（または何も）で運用されている状態。
      signals: [long_lived_case_without_review_triggers, periodic_review_passes_without_condition_evaluation, environment_changed_but_no_trigger_fired]
      threshold: "duration / duration=90d"
      decisions: [proceed, defer]

    # ---- 運用 ----
    - id: stagnation
      principle: 運用
      detects: >
        判断されるべき案件が閉じられないまま止まっている状態。未解決の Δ、期限を過ぎた Defer、完了しない Retire を含む。
      kinds: [unresolved, deferred, retiring]
      signals: [ticket_open_too_long, defer_without_resolution, repeated_review_without_closure]
      threshold: "duration / duration=7d"
      decisions: [defer, retire, reframe]

  composition_rules:
    chapter_minimum: [owner_missing, precondition_broken]
    chapter_recommended: [stagnation, spread_signal_observed]
    extension: 各章は芯の指標を継承し、必要に応じて領域固有の指標を追加してよい。追加する指標にも principle を付ける。

  output_contract: [metric_id, status, observed_at, evidence, suggested_decisions, confidence]

  # ===============================================================
  # 拡張：AI 統制と運用適合（VCDesign 固有。正本の5原則の外側）
  # ===============================================================
  ai_extension:
    concept: >
      成長はモデル能力の増大ではなく、責任制約下での運用適合の改善として評価する。
      説明は docs/ai-extension.md。
    growth_properties:
      - better_delta_detection
      - better_semantic_interpretation
      - better_value_alignment
      - better_judgment_consistency
      - better_halt_readiness
      - lower_boundary_violation
    metrics:
      - id: ai_overreach
        detects: AIが補助範囲を超えて、実質的な最終判断や責任配置を握っている状態。
        signals: [ai_recommendation_auto_accepted, human_review_nominal_only, decision_reason_not_human_explainable]
        threshold: "ratio_or_pattern / acceptance_ratio=0.9, duration=1h"
        decisions: [proceed, reframe, defer]
      - id: owner_conflict
        detects: 複数主体が同一責任を同時に持つ、または責任境界が矛盾している状態。
        signals: [multiple_actors_claiming_ownership, inconsistent_role_assignment, contradictory_operational_instructions]
        threshold: "immediate_or_repeated / repeated_count=2"
        decisions: [proceed, defer, reframe]
      - id: operator_overload
        detects: 現場判断主体に、本来構造で吸収すべき負荷が押し戻されている状態。
        signals: [excessive_manual_judgment_count, alert_fatigue, decision_latency_increase]
        threshold: "rate_or_latency / latency_growth_ratio=1.5, repeated_events=20"
        decisions: [proceed, reframe]
      - id: authority_confusion_detected
        detects: >
          AI/Agent の能力（実行できる）と権限（実行してよい）が混同されている状態。高性能だから任せる、という決定経路の検知。
        signals: [agent_acted_outside_declared_boundary, no_explicit_authority_grant_before_execution, capability_cited_as_justification_for_action]
        threshold: "immediate"
        decisions: [proceed, reframe]
      - id: missing_execution_gate
        detects: >
          Agent が計画を現実系（ファイル・API・DB 等）へ反映する前に policy 適合チェックおよび責任者承認が存在しない状態。
        signals: [agent_plan_directly_executed_without_review, no_policy_check_record_before_real_world_write, tool_invocation_with_no_responsible_actor_log]
        threshold: "immediate_or_pattern / count=1"
        decisions: [proceed, reframe]
      - id: missing_halt_owner
        detects: >
          長時間動作 Agent に対して halt_owner が未指定、または 部分的障害時に halt_owner が介入できない状態。
        signals: [no_halt_owner_named_at_agent_launch, halt_path_not_tested_under_partial_failure, emergency_stop_requires_agent_cooperation]
        threshold: "immediate"
        decisions: [proceed, defer]
      - id: explainability_insufficient_for_impact
        detects: >
          操作の影響水準（low/medium/high）に対して、充足すべき explainability 要件が満たされていない状態。
        signals: [high_impact_action_missing_responsibility_path, medium_impact_action_missing_delta_to_action_mapping, adoption_reason_not_recorded_for_high_impact_agent]
        threshold: "immediate_for_high_impact / high_impact=immediate, medium_impact=24h"
        decisions: [proceed, defer]
      - id: autonomous_scope_expansion_detected
        detects: >
          Agent が宣言された実行境界を超えて、未承認のスコープへ操作を拡大している状態。特に fast loop が slow loop の制約を書き換えるパターン。
        signals: [agent_accessed_resources_outside_declared_scope, agent_modified_value_objectives_without_review, scope_creep_without_responsibility_reassignment]
        threshold: "immediate"
        decisions: [proceed, reframe, retire]
      - id: policy_bypass_attempt_detected
        detects: >
          Agent の計画または実行が、明示的に禁止された操作 （AI による最終判断・直接物理制御・責任配置の自律的変更等）を 迂回または無効化しようとしている状態。
        signals: [agent_routed_around_safety_gate, policy_check_disabled_or_mocked_in_agent_plan, forbidden_operation_reframed_as_allowed_by_agent]
        threshold: "immediate"
        decisions: [proceed, retire]
      - id: delta_detection_quality
        detects: 現実のズレをノイズと区別しつつ、責任影響のあるΔを適切に検出できている度合い。
        signals: [confirmed_delta_precision, confirmed_delta_recall, low_false_alarm_rate]
      - id: semantic_interpretation_quality
        detects: 観測されたΔ候補を、文脈・章・責任に沿って意味解釈できている度合い。
        signals: [interpretation_agreement_with_human_review, low_context_loss, stable_delta_classification]
      - id: value_alignment_quality
        detects: 運用中の判断や改善が、明示された目的・制約・価値継続要件に整合している度合い。
        signals: [review_pass_rate, explicit_objective_traceability, low_goal_shift_incidents]
      - id: judgment_consistency
        detects: 類似事例に対する判断理由、介入条件、Action選択が一貫している度合い。
        signals: [decision_reason_similarity, policy_conformance_rate, low_conflicting_resolution_rate]
      - id: boundary_violation_rate
        detects: LLM越権、無審査実行、責任経路欠落などの境界破りが発生する頻度。
        signals: [direct_execution_without_gate, missing_policy_check, missing_trace_on_cross_boundary_actions]
      - id: human_override_recovery_quality
        detects: 人間介入後に、システムが責任を保ったまま安全状態へ復帰できる度合い。
        signals: [recovery_time_after_override, post_override_incident_rate, completeness_of_review_record]
